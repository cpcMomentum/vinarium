name: node

# Frontend-Gate: Typecheck + vitest + Produktions-Build muessen gruen sein.
# Laeuft auf ALLEN PRs (kein paths-Filter): als Required-Status-Check muss der
# Workflow immer melden, sonst blockiert ein nie-startender Check den Merge.
# (Kein lint-Script in package.json.)

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: der Bundle-Check diffst gegen den Ziel-Branch
          # und braucht die Merge-Base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Abhaengigkeiten installieren
        # npm/cli#4828: ein auf anderem OS erzeugter Lock laesst das plattform-
        # spezifische rollup-Binary fehlen. Lock entfernen erzwingt frische,
        # plattform-korrekte Aufloesung auf dem Linux-Runner.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      # Faengt Strings ab, die in t()/n()/->t() stehen, aber in keiner l10n-Datei.
      # Solche Texte fallen in JEDER Sprache auf den deutschen Quelltext zurueck
      # und bleiben beim Entwickeln unsichtbar, weil auf Deutsch getestet wird.
      # Faengt vergessene Frontend-Builds. Kein Byte-Diff — der Build ist in der
      # CI nicht reproduzierbar (contractmanager#251): der Lock wird verworfen
      # und die Node-Version weicht ab, ein Rebuild ohne Quelltextaenderung
      # erzeugt schon andere Minifier-Kuerzel. Stattdessen: wurden Eingaben
      # geaendert, ohne dass sich js/ und css/ geaendert haben? Genau so blieb
      # bei contractmanager#327 eine verwundbare Abhaengigkeit im
      # ausgelieferten Bundle stehen.
      - name: Bundle aktuell
        if: github.event_name == 'pull_request'
        env:
          # Nicht direkt in run: interpolieren — ein Branch-Name kann
          # Shell-Metazeichen enthalten (Script-Injection).
          BASE_REF: ${{ github.base_ref }}
        run: npx --no-install nc-bundle-check "origin/$BASE_REF"

      - name: l10n-Vollstaendigkeit
        run: npm run l10n:check

      - name: Typecheck
        run: npm run typecheck
      - name: Frontend-Unit-Tests (vitest)
        run: npm test -- --passWithNoTests
      - name: Produktions-Build
        run: npm run build
